<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Padlock Body Gradient -->
    <linearGradient id="lockBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Shackle Metallic Gradient -->
    <linearGradient id="shackleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Lightning Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Shield / Rounded Container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Outer Ambient Glow -->
  <rect x="3" y="3" width="58" height="58" rx="13" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25" />

  <!-- Padlock Shackle (Arco del Lucchetto) -->
  <path d="M 22 28 V 19 C 22 13.477 26.477 9 32 9 C 37.523 9 42 13.477 42 19 V 28" 
        fill="none" 
        stroke="url(#shackleGrad)" 
        stroke-width="5" 
        stroke-linecap="round" />

  <!-- Padlock Body (Corpo del Lucchetto) -->
  <rect x="15" y="27" width="34" height="26" rx="6" fill="url(#lockBodyGrad)" stroke="#38bdf8" stroke-width="1.5" />

  <!-- Lock Body Inner Highlight -->
  <rect x="17" y="29" width="30" height="2" rx="1" fill="#ffffff" fill-opacity="0.35" />

  <!-- Lightning Bolt Keyhole (Fulmine / Chiave Elettrica) -->
  <path d="M 33 32 L 27 41 H 33 L 31 48 L 39 39 H 33 Z" 
        fill="#f8fafc" 
        filter="url(#glow)" />
</svg>
